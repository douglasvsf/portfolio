version: 2
updates:
  # Dependências npm do monorepo: um PR semanal agrupado (menos ruído),
  # com atualizações de segurança sempre separadas e imediatas.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
